name: release

# Primary trigger: a push to main that changes the version file. The job reads
# the version, builds and pushes the image, then `gh release create --target`
# creates the vX.Y.Z tag and the GitHub release itself, so nobody pushes a tag.
# The v*.*.* tag trigger is a manual fallback only (path filters do not apply
# to tag pushes). Both paths share one concurrency group and refuse to release
# a version that already has a tag or release, so a version is built once.
on:
  push:
    branches: ["main"]
    paths:
      - "VERSION"
      - "package.json"
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          # version file (adjust for the app's language)
          if [ -f package.json ]; then
            FILE_VERSION="$(node -p "require('./package.json').version")"
          elif [ -f VERSION ]; then
            FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          else
            echo "No version file"; exit 1
          fi
          [[ "$FILE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version '$FILE_VERSION' is not MAJOR.MINOR.PATCH"; exit 1; }
          VERSION="$FILE_VERSION"
          echo "Version: $VERSION (event: $GITHUB_EVENT_NAME, ref: $GITHUB_REF)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # manual fallback: the pushed tag must equal the version file
            [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "Tag $GITHUB_REF_NAME != version file v$VERSION"; exit 1; }
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "Release v$VERSION already exists; it was already built"; exit 1
            fi
          else
            # normal path: the tag must not exist yet
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "Tag v$VERSION already exists; bump the version"; exit 1
            fi
          fi
          # changelog must contain this version with Short <= 50 and Long <= 250 chars
          grep -q "^## v$VERSION " CHANGELOG.md || { echo "CHANGELOG.md has no entry for v$VERSION"; exit 1; }
          SHORT="$(awk -v v="## v$VERSION " 'index($0,v)==1{f=1;next} f&&/^\*\*Short:\*\*/{sub(/^\*\*Short:\*\* /,"");print;exit}' CHANGELOG.md)"
          LONG="$(awk -v v="## v$VERSION " 'index($0,v)==1{f=1;next} f&&/^\*\*Long:\*\*/{sub(/^\*\*Long:\*\* /,"");print;exit}' CHANGELOG.md)"
          [ "${#SHORT}" -gt 0 ] && [ "${#SHORT}" -le 50 ] || { echo "Short is ${#SHORT} chars (max 50)"; exit 1; }
          [ "${#LONG}" -gt 0 ] && [ "${#LONG}" -le 250 ] || { echo "Long is ${#LONG} chars (max 250)"; exit 1; }
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: mybadreligon/${{ github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        shell: bash
        run: |
          set -euo pipefail
          # Creates the vX.Y.Z tag at this commit when it does not exist yet.
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION - $SHORT" --notes-file <(awk -v v="## v$VERSION " 'index($0,v)==1{f=1;next} f&&/^## v/{exit} f' CHANGELOG.md)
