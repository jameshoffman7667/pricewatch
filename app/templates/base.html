<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PriceWatch{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1216; --panel: #171b21; --border: #262c35; --text: #e7eaee;
      --muted: #8b93a1; --accent: #4f8cff; --good: #35c37d; --bad: #ff5d5d; --warn: #f5b942;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           background: var(--bg); color: var(--text); }
    a { color: var(--accent); text-decoration: none; }
    header { display:flex; align-items:center; justify-content:space-between; padding: 14px 24px;
              border-bottom: 1px solid var(--border); background: var(--panel); }
    header .brand { font-weight:700; font-size:18px; }
    header nav a { margin-left: 18px; color: var(--muted); }
    header nav a:hover { color: var(--text); }
    main { max-width: 1000px; margin: 0 auto; padding: 24px; }
    .btn { display:inline-block; background: var(--accent); color:white; border:none; padding: 8px 14px;
           border-radius: 6px; cursor:pointer; font-size:14px; }
    .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn.danger { background: var(--bad); }
    .btn.small { padding: 4px 10px; font-size: 12px; }
    table { width:100%; border-collapse: collapse; }
    th, td { text-align:left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { color: var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em;}
    .card { background: var(--panel); border:1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px;}
    .pill { display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight:600; }
    .pill.ok { background: rgba(53,195,125,.15); color: var(--good); }
    .pill.error { background: rgba(255,93,93,.15); color: var(--bad); }
    .pill.changed { background: rgba(245,185,66,.15); color: var(--warn); }
    .pill.off { background: rgba(139,147,161,.15); color: var(--muted); }
    form.inline { display:inline; }
    label { display:block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
    input, select, textarea { width:100%; padding: 8px 10px; background:#0c0f13; border:1px solid var(--border);
           color: var(--text); border-radius: 6px; font-size: 14px; }
    .row { display:flex; gap:16px; }
    .row > div { flex:1; }
    .checkbox-row { display:flex; align-items:center; gap:8px; margin-top: 10px; }
    .checkbox-row input { width:auto; }
    .muted { color: var(--muted); font-size: 13px; }
    .empty { text-align:center; padding: 60px 20px; color: var(--muted); }
    .price { font-size: 28px; font-weight:700; }
    .actions { margin-top: 16px; display:flex; gap:8px; }
    code { background:#0c0f13; padding:2px 6px; border-radius:4px; }
    .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; }
    .tabs a { padding:8px 14px; color: var(--muted); border-bottom:2px solid transparent; font-size:14px; }
    .tabs a.active { color: var(--text); border-bottom-color: var(--accent); }
    .deal-row { display:flex; gap:12px; align-items:center; padding:12px 8px; border-bottom:1px solid var(--border); }
    .deal-row:hover { background: rgba(255,255,255,.02); }
    .deal-row img.thumb { width:48px; height:48px; object-fit:cover; border-radius:6px; background:#0c0f13; flex-shrink:0; }
    .deal-row .title { flex:1; min-width:0; }
    .deal-row .title a { color: var(--text); font-weight:500; }
    .deal-price { font-weight:700; white-space:nowrap; }
    .deal-price .orig { color: var(--muted); font-weight:400; text-decoration:line-through; margin-left:6px; font-size:12px; }
    .star-btn { background:none; border:none; cursor:pointer; font-size:18px; color: var(--muted); padding:2px 6px; }
    .star-btn.on { color: var(--warn); }
    .summary-block { background:#0c0f13; border:1px solid var(--border); border-radius:8px; padding:16px; margin:16px 0; }
    .summary-block ul { margin: 8px 0 0 0; padding-left: 20px; }
    .summary-block li { margin-bottom: 6px; font-size: 14px; }
    .link-list { display:flex; flex-wrap:wrap; gap:8px; margin-top: 8px; }
  </style>
</head>
<body>
<header>
  <div class="brand">💲 PriceWatch</div>
  <nav>
    <a href="/">Monitors</a>
    <a href="/monitors/new">+ New Monitor</a>
    <a href="/deals">Deals</a>
    <a href="/channels">Notifications</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
