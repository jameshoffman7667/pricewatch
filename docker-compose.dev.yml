# Local development only: builds the image from source.
#   docker compose -f docker-compose.dev.yml up -d --build
# Servers use deploy/compose.yaml (pulls the released image).
services:
  pricewatch:
    build: .
    image: pricewatch:dev
    container_name: pricewatch-dev
    ports:
      - "5400:5400"
    volumes:
      - pricewatch_data:/data
    environment:
      - PORT=5400
      - PRICEWATCH_DATA_DIR=/data
      - TZ=America/Toronto

volumes:
  pricewatch_data:
