# Local development / testing compose file: builds the image from source
# instead of pulling from Docker Hub. Use this while iterating on the code.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
# For a normal deployment (e.g. via Dockhand), use docker-compose.yml
# instead, which pulls the published image.
services:
  pricewatch:
    build: .
    image: pricewatch:dev
    container_name: pricewatch
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - pricewatch_data:/data
    environment:
      - PRICEWATCH_DATA_DIR=/data
      - TZ=${TZ:-UTC}

volumes:
  pricewatch_data:
